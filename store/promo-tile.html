<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 440px; height: 280px; overflow: hidden; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      background:
        radial-gradient(circle at 15% 30%, rgba(37,99,235,0.35) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(16,185,129,0.20) 0%, transparent 38%),
        linear-gradient(150deg, #060d1c 0%, #0c1829 60%, #081220 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      position: relative;
    }

    /* grid dots */
    body::before {
      content: '';
      position: absolute; inset: 0;
      background-image: radial-gradient(circle, rgba(148,163,184,0.12) 1px, transparent 1px);
      background-size: 22px 22px;
    }

    .logo-row {
      display: flex; align-items: center; gap: 14px;
      position: relative;
    }

    .icon {
      width: 52px; height: 52px; border-radius: 14px;
      background: linear-gradient(135deg, #1d4ed8 0%, #0284c7 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(37,99,235,0.55);
    }
    .icon svg { width: 28px; height: 28px; }

    .title {
      font-size: 28px; font-weight: 700; letter-spacing: -0.5px;
      color: #f0f6ff;
    }

    .tagline {
      font-size: 13.5px; color: rgba(148,163,184,0.90);
      letter-spacing: 0.2px; text-align: center;
      position: relative;
    }

    .pills {
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
      position: relative;
    }
    .pill {
      padding: 4px 11px; border-radius: 20px; font-size: 11px; font-weight: 500;
      letter-spacing: 0.3px;
    }
    .pill-blue   { background: rgba(37,99,235,0.25); color: #93c5fd; border: 1px solid rgba(37,99,235,0.4); }
    .pill-green  { background: rgba(16,185,129,0.18); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.35); }
    .pill-purple { background: rgba(139,92,246,0.18); color: #c4b5fd; border: 1px solid rgba(139,92,246,0.32); }
    .pill-amber  { background: rgba(245,158,11,0.15); color: #fcd34d; border: 1px solid rgba(245,158,11,0.30); }
  </style>
</head>
<body>
  <div class="logo-row">
    <div class="icon">
      <!-- archive / database icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="#e0f2fe" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="12" cy="5" rx="9" ry="3"/>
        <path d="M3 5v4c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/>
        <path d="M3 9v4c0 1.66 4.03 3 9 3s9-1.34 9-3V9"/>
        <path d="M3 13v4c0 1.66 4.03 3 9 3s9-1.34 9-3v-4"/>
      </svg>
    </div>
    <span class="title">StorageDump</span>
  </div>

  <div class="tagline">Inspect &amp; export every byte a website stores in your browser</div>

  <div class="pills">
    <span class="pill pill-blue">Cookies</span>
    <span class="pill pill-green">localStorage</span>
    <span class="pill pill-purple">IndexedDB</span>
    <span class="pill pill-amber">Cache API</span>
    <span class="pill pill-blue">sessionStorage</span>
    <span class="pill pill-green">ZIP / JSON export</span>
  </div>
</body>
</html>
