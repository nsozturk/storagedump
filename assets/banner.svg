<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="0.55" stop-color="#101a30"/>
      <stop offset="1" stop-color="#161329"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="360" fill="url(#glow)"/>

  <!-- left: wordmark + tagline -->
  <text x="80" y="150" fill="#ffffff" font-size="80" font-weight="800" letter-spacing="-2">Storage<tspan fill="url(#accent)">Dump</tspan></text>
  <text x="84" y="205" fill="#8b98a9" font-size="26" font-weight="500">Every byte a site stores, <tspan fill="#60A5FA" font-weight="700">in one export</tspan>.</text>

  <!-- command chip -->
  <g transform="translate(84,238)">
    <rect width="290" height="46" rx="10" fill="#111827" stroke="#2a3342"/>
    <rect x="18" y="18" width="11" height="11" rx="2" fill="#3fb950"/>
    <text x="40" y="31" fill="url(#accent)" font-size="21" font-weight="700" font-family="'SF Mono',Menlo,monospace">Scan → Export all</text>
  </g>
  <text x="396" y="268" fill="#6e7681" font-size="17">cookies · storage · IndexedDB · caches</text>

  <!-- right: window card -->
  <g transform="translate(792,70)">
    <rect width="408" height="220" rx="14" fill="#0b0f16" stroke="#2a3342"/>
    <circle cx="26" cy="26" r="6" fill="#ff5f56"/>
    <circle cx="48" cy="26" r="6" fill="#ffbd2e"/>
    <circle cx="70" cy="26" r="6" fill="#27c93f"/>
    <g font-family="'SF Mono',Menlo,monospace" font-size="18" fill="#c9d1d9">
      <text x="24" y="72">cookies</text><text x="230" y="72" fill="#8b98a9">37</text><text x="330" y="72" fill="#3fb950">✓</text>
      <text x="24" y="102">localStorage</text><text x="230" y="102" fill="#8b98a9">96</text><text x="330" y="102" fill="#3fb950">✓</text>
      <text x="24" y="132">IndexedDB</text><text x="230" y="132" fill="#8b98a9">99</text><text x="330" y="132" fill="#3fb950">✓</text>
      <text x="24" y="162">Cache</text><text x="230" y="162" fill="#8b98a9">3</text><text x="330" y="162" fill="#3fb950">✓</text>
    </g>
    <line x1="24" y1="180" x2="384" y2="180" stroke="#2a3342"/>
    <text x="24" y="204" font-family="'SF Mono',Menlo,monospace" font-size="17" fill="#60A5FA">→ storagedump_site.zip</text>
  </g>
</svg>
